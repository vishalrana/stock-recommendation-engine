name: Swing Research Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Research Stage (data | replication | sleeves | overlays | all)'
        required: true
        default: 'all'
        type: choice
        options:
          - data
          - replication
          - sleeves
          - overlays
          - all
      universe:
        description: 'Evaluated Universe (u1 | u2 | both)'
        required: true
        default: 'both'
        type: choice
        options:
          - u1
          - u2
          - both
      placebo:
        description: 'Number of random-stock placebo iterations'
        required: true
        default: '200'
        type: string
      limit:
        description: 'Limit number of tickers / runs for smoke testing (leave empty for full run)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - swing-signals
    paths:
      - '.github/swing_research_trigger.json'

concurrency:
  group: swing-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-data:
    name: Build Long History Data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt

      - name: Cache Long History Data
        id: cache-long-history
        uses: actions/cache@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/sec_filings
          key: swing-data-long-${{ hashFiles('data/reference/sp500_ticker_start_end.csv') }}-v1
          restore-keys: |
            swing-data-long-

      - name: Determine Trigger Inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
            echo "universe=${{ github.event.inputs.universe }}" >> $GITHUB_OUTPUT
            echo "placebo=${{ github.event.inputs.placebo }}" >> $GITHUB_OUTPUT
            echo "limit=${{ github.event.inputs.limit }}" >> $GITHUB_OUTPUT
          else
            STAGE=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('stage', 'all'))")
            UNIVERSE=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('universe', 'both'))")
            PLACEBO=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('placebo', 200))")
            LIMIT=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('limit') or '')")
            echo "stage=$STAGE" >> $GITHUB_OUTPUT
            echo "universe=$UNIVERSE" >> $GITHUB_OUTPUT
            echo "placebo=$PLACEBO" >> $GITHUB_OUTPUT
            echo "limit=$LIMIT" >> $GITHUB_OUTPUT
          fi

      - name: Build Price Data (2004 Onward)
        if: steps.inputs.outputs.stage == 'data' || steps.inputs.outputs.stage == 'all'
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ steps.inputs.outputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ steps.inputs.outputs.limit }}"
          fi
          python scripts/build_long_history.py $LIMIT_FLAG

      - name: Build SEC Long History
        if: steps.inputs.outputs.stage == 'data' || steps.inputs.outputs.stage == 'all'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ steps.inputs.outputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ steps.inputs.outputs.limit }}"
          fi
          python scripts/build_sec_history.py $LIMIT_FLAG

      - name: Build Short Interest History
        if: steps.inputs.outputs.stage == 'data' || steps.inputs.outputs.stage == 'all'
        run: |
          python scripts/build_short_interest.py

      - name: Evaluate Survivorship By Year
        run: |
          python scripts/report_survivorship_by_year.py

      - name: Upload Data Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-data-outputs
          path: |
            outputs/swing/
            outputs/research_trials.jsonl
          if-no-files-found: ignore

  research-run:
    name: Research & Sleeves Evaluation
    needs: build-data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-research.txt

      - name: Restore Long History Data Cache
        uses: actions/cache@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/sec_filings
          key: swing-data-long-${{ hashFiles('data/reference/sp500_ticker_start_end.csv') }}-v1
          restore-keys: |
            swing-data-long-

      - name: Determine Trigger Inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> $GITHUB_OUTPUT
            echo "universe=${{ github.event.inputs.universe }}" >> $GITHUB_OUTPUT
            echo "placebo=${{ github.event.inputs.placebo }}" >> $GITHUB_OUTPUT
            echo "limit=${{ github.event.inputs.limit }}" >> $GITHUB_OUTPUT
          else
            STAGE=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('stage', 'all'))")
            UNIVERSE=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('universe', 'both'))")
            PLACEBO=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('placebo', 200))")
            LIMIT=$(python -c "import json; d=json.load(open('.github/swing_research_trigger.json')); print(d.get('limit') or '')")
            echo "stage=$STAGE" >> $GITHUB_OUTPUT
            echo "universe=$UNIVERSE" >> $GITHUB_OUTPUT
            echo "placebo=$PLACEBO" >> $GITHUB_OUTPUT
            echo "limit=$LIMIT" >> $GITHUB_OUTPUT
          fi

      - name: Execute Swing Research Suite
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          LIMIT_FLAG=""
          if [ -n "${{ steps.inputs.outputs.limit }}" ]; then
            LIMIT_FLAG="--limit ${{ steps.inputs.outputs.limit }}"
          fi
          python scripts/research_swing.py \
            --stage "${{ steps.inputs.outputs.stage }}" \
            --universe "${{ steps.inputs.outputs.universe }}" \
            --placebo "${{ steps.inputs.outputs.placebo }}" \
            $LIMIT_FLAG

      - name: Upload Research Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-research-outputs
          path: |
            outputs/swing/
            outputs/research_trials.jsonl
            config/swing_sleeves.json
          if-no-files-found: ignore
