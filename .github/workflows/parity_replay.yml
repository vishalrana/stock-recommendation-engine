name: Parity Replay

# Replays one live Ideas session through the backtest harness (validate_backtest_pipeline.py
# --replay-session) and compares it with what the nightly scan decided (scripts/parity_replay.py):
# issued sets, and every candidate whose outcome differs, with its cause.

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday: Friday's session, after both nightly attempts (01:00 and 04:00 UTC)
  workflow_dispatch:
    inputs:
      session:
        description: 'Live scan date to replay (YYYY-MM-DD; empty = the latest completed session)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      SKIP_NLP: 'true'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r jobs/requirements.txt
      # Only a session whose nightly finished with status success is replayed
      - name: Session to replay
        id: s
        run: |
          S="${{ inputs.session }}"
          if [ -z "$S" ]; then S=$(python -c "from src.utils.market_date import latest_completed_session as l; print(l())"); fi
          STATUS=$(python scripts/parity_replay.py --date "$S" --print-status | tail -1)
          echo "Session $S: nightly status $STATUS"
          echo "session=$S" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "success" ]; then
            echo "::warning::Not replayed: the nightly for $S has status $STATUS, not success"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Prices are re-downloaded (--refresh-data) so the session's bars exist; SEC filings are
      # fetched fresh and cut at the session's 20:00 ET cutoff by the shared point-in-time code.
      - name: Harness decisions for the session
        if: steps.s.outputs.skip != 'true'
        run: |
          OPEN=$(python scripts/parity_replay.py --date "${{ steps.s.outputs.session }}" --print-open | tail -1)
          echo "Ideas open before the session: $OPEN"
          python scripts/validate_backtest_pipeline.py --universe production --workers 4 \
            --replay-session "${{ steps.s.outputs.session }}" --replay-active "$OPEN" --refresh-data
      - name: Compare with the live scan
        if: steps.s.outputs.skip != 'true'
        run: python scripts/parity_replay.py --date "${{ steps.s.outputs.session }}" --harness-csv "outputs/parity_replay_${{ steps.s.outputs.session }}_harness.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-replay
          retention-days: 90
          path: outputs/parity_replay_*
