name: Parity Replay

# Replays one live Ideas session through the backtest harness (validate_backtest_pipeline.py
# --replay-session) and compares it with what the nightly scan decided (scripts/parity_replay.py):
# issued sets, and every candidate whose outcome differs, with its cause.

on:
  schedule:
    - cron: '0 12 * * 6'   # Saturday: the latest successful session of the week (Friday's when it succeeded)
  workflow_dispatch:
    inputs:
      session:
        description: 'Live scan date to replay (YYYY-MM-DD; empty = the latest successful session of the past week)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      SKIP_NLP: 'true'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r jobs/requirements.txt
      # Only a session whose nightly finished with status success is replayed. Scheduled: the latest
      # such session of the past week (a stale Friday must not mean no check); none fails the run.
      # shell: bash adds pipefail, so a crash inside $(... | tail -1) fails the step.
      - name: Session to replay
        id: s
        shell: bash
        run: |
          if [ -n "${{ inputs.session }}" ]; then
            S="${{ inputs.session }}"
            STATUS=$(python scripts/parity_replay.py --date "$S" --print-status | tail -1)
            if [ -z "$STATUS" ]; then echo "::error::Could not read the nightly status of $S"; exit 1; fi
            if [ "$STATUS" != "success" ]; then
              echo "::error::Not replayed: the nightly for $S has status $STATUS, not success"; exit 1
            fi
          else
            S=$(python scripts/parity_replay.py --latest-success 7 | tail -1)
          fi
          if [ -z "$S" ]; then echo "::error::No session to replay"; exit 1; fi
          echo "Replaying session $S"
          echo "session=$S" >> "$GITHUB_OUTPUT"
      # Prices are re-downloaded (--refresh-data) so the session's bars exist; SEC filings are
      # fetched fresh and cut at the session's 20:00 ET cutoff by the shared point-in-time code.
      - name: Harness decisions for the session
        shell: bash
        run: |
          OPEN=$(python scripts/parity_replay.py --date "${{ steps.s.outputs.session }}" --print-open | tail -1)
          echo "Ideas open before the session: ${OPEN:-none}"
          python scripts/validate_backtest_pipeline.py --universe production --workers 4 \
            --replay-session "${{ steps.s.outputs.session }}" --replay-active "$OPEN" --refresh-data
      - name: Compare with the live scan
        shell: bash
        run: python scripts/parity_replay.py --date "${{ steps.s.outputs.session }}" --harness-csv "outputs/parity_replay_${{ steps.s.outputs.session }}_harness.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-replay
          retention-days: 90
          path: outputs/parity_replay_*
