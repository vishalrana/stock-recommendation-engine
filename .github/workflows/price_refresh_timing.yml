name: Price refresh timing

# Times the nightly's price refresh with corporate-action refetch (CacheManager.refresh_with_actions)
# on a copy of the nightly's restored cache. No Supabase access, and the cache is not saved back.

on:
  workflow_dispatch:
    inputs:
      actions_since:
        description: 'Count dividends and splits from this date as new (YYYY-MM-DD; empty = last cached session)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      SKIP_NLP: 'true'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-data-cache-v2-none
          restore-keys: |
            ${{ runner.os }}-data-cache-v2-
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r jobs/requirements.txt
      - name: Refresh and time
        run: python scripts/time_price_refresh.py ${{ inputs.actions_since && format('--actions-since {0}', inputs.actions_since) || '' }}
