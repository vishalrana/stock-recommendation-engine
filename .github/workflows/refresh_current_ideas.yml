name: Refresh Current Ideas

'on':
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated current idea tickers to evaluate'
        required: true
        type: string

concurrency:
  group: refresh-current-ideas
  cancel-in-progress: false

jobs:
  refresh-ideas:
    name: Evaluate Current Ideas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log Start Time
        env:
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          echo "=========================================="
          echo "  REFRESH CURRENT IDEAS — STARTED"
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "Tickers:    $INPUT_TICKERS"
          echo "UTC Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner:     $(uname -a)"
          echo "=========================================="

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git HEAD matches origin/main
        run: |
          git fetch origin main
          LOCAL_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git rev-parse origin/main)
          echo "Local HEAD:  $LOCAL_HEAD"
          echo "Remote HEAD: $REMOTE_HEAD"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "❌ ERROR: Local checkout does not match origin/main!"
            exit 1
          fi
          echo "✅ HEAD verified matches origin/main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Restore the nightly scan's price and fundamentals cache. Restore only, never save: a
      # targeted refresh updates a handful of tickers and must not become the cache the nightly
      # scan restores. (The old separate "v1" cache held almost no history, so every idea was
      # skipped as having too few bars and the refresh changed nothing.)
      - name: Restore Data Cache (from nightly scan)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-data-cache-v2-refresh-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-data-cache-v2-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r jobs/requirements.txt
          echo "✅ Dependencies installed."

      - name: Run Targeted Signal Evaluation
        id: evaluate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_ACTIONS: 'true'
          CACHE_MODE: incremental
          PYTHONPATH: .
          INPUT_TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          echo "Starting targeted evaluation for current ideas: $INPUT_TICKERS"
          START_EPOCH=$(date +%s)

          python jobs/generate_signals.py --tickers "$INPUT_TICKERS"
          EXIT_CODE=$?

          END_EPOCH=$(date +%s)
          DURATION=$((END_EPOCH - START_EPOCH))

          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Targeted evaluation FAILED (exit code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi

          echo "✅ Targeted evaluation completed in ${DURATION}s"

      - name: Log Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  REFRESH CURRENT IDEAS — FINISHED"
          echo "=========================================="
          echo "UTC Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Duration:   ${{ steps.evaluate.outputs.duration || 'N/A' }}s"
          echo "Exit Code:  ${{ steps.evaluate.outputs.exit_code || 'N/A' }}"
          echo "Status:     ${{ job.status }}"
          echo "=========================================="
