name: Nightly Recommendation Scan

on:
  schedule:
    # Run 1-2 hours after EOD data settles (8:00 PM ET / 20:00 ET, Mon-Fri)
    # 20:00 EST/EDT corresponds to 00:00 / 01:00 UTC on the next day (Tue-Sat)
    - cron: '0 1 * * 2-6'
    # Second attempt: GitHub often starts the 01:00 run hours late or drops it. A scheduled run
    # exits at once when scan_log already holds a successful scan of the session.
    - cron: '0 4 * * 2-6'
  workflow_dispatch: # Manual trigger from GitHub UI (always scans)

concurrency:
  group: nightly-scan
  cancel-in-progress: false

jobs:
  nightly-scan:
    name: Generate Signals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      skipped: ${{ steps.scan.outputs.skipped }}

    steps:
      - name: Log Start Time
        run: |
          echo "=========================================="
          echo "  NIGHTLY SCAN — STARTED"
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "UTC Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Runner:     $(uname -a)"
          echo "=========================================="

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git HEAD matches origin/main (trials-registry commits allowed)
        run: bash scripts/verify_head.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Data Files
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-data-cache-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-data-cache-v2-
            ${{ runner.os }}-data-cache-v1-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r jobs/requirements.txt
          echo "✅ Dependencies installed."

      - name: Validate Ticker List
        run: |
          echo "Validating ticker list..."

      - name: Run Signal Generation
        id: scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GITHUB_ACTIONS: 'true'
          PYTHONPATH: .
          MAX_PROVIDER_EARNINGS_FETCHES: '0'
          SKIP_IF_SESSION_DONE: ${{ github.event_name == 'schedule' }}
        run: |
          echo "Starting signal generation..."
          START_EPOCH=$(date +%s)

          # Always incremental: a scan must never depend on a full re-download finishing.
          python -m jobs.generate_signals --cache-mode incremental
          EXIT_CODE=$?

          END_EPOCH=$(date +%s)
          DURATION=$((END_EPOCH - START_EPOCH))

          echo "duration=${DURATION}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Signal generation FAILED (exit code: $EXIT_CODE)"
            exit $EXIT_CODE
          fi

          echo "✅ Signal generation completed in ${DURATION}s"

      - name: Log Summary
        if: always()
        run: |
          echo "=========================================="
          echo "  NIGHTLY SCAN — FINISHED"
          echo "=========================================="
          echo "UTC Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Duration:   ${{ steps.scan.outputs.duration || 'N/A' }}s"
          echo "Exit Code:  ${{ steps.scan.outputs.exit_code || 'N/A' }}"
          echo "Status:     ${{ job.status }}"
          echo "=========================================="

  validate-outcomes:
    name: Validate 20-day-old signals
    runs-on: ubuntu-latest
    needs: nightly-scan   # runs only after main scan succeeds
    if: needs.nightly-scan.outputs.skipped != 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git HEAD matches origin/main (trials-registry commits allowed)
        run: bash scripts/verify_head.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r jobs/requirements.txt
          echo "✅ Dependencies installed."
      - name: Run outcome validation
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m jobs.validate_ranking
          echo "✅ Outcome validation complete."
