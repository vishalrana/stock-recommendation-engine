# Configuration for Context Scorer (Earnings Decoupled)
global_multiplier: 0.15  # Default context multiplier

max_scores:
  analyst: 40
  fundamental: 20
  news: 20
  pv_signal: 15

analyst:
  upside_threshold_bonus: 0.05
  buy_bonus: 10

fundamental:
  debt_to_equity_max: 1.0
  current_ratio_min: 1.5

news:
  sentiment_positive_threshold: 0.1
  sentiment_negative_threshold: -0.1
