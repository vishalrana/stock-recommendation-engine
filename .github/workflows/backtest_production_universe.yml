name: Backtest (production universe)

# Production-pipeline backtest on the universe the nightly scan actually uses (broad US common
# equities, ~5,600 tickers), run on GitHub's servers because it needs more memory and time than a
# laptop. Results are uploaded as an artifact; adopting the evidence in
# config/strategy_performance.json is a separate, deliberate step.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Smoke test: only the first N stocks (empty = full universe; outputs are not written in smoke tests)'
        required: false
        default: ''
      variants:
        description: 'Comma-separated variants evaluated in the same pass (empty = production only)'
        required: false
        default: ''
      trial_phase:
        description: 'Trials-registry phase label (e.g. phase2); pre-registered trials only'
        required: false
        default: 'adhoc'
      placebo:
        description: 'Random-stock placebo draws per idea (empty = 200, or 20 in smoke tests; 0 = off)'
        required: false
        default: ''

concurrency:
  group: backtest-production-universe
  cancel-in-progress: false

permissions:
  contents: write   # the trials registry is pushed to main

jobs:
  backtest:
    name: Production-universe backtest
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      PYTHONPATH: .
      SKIP_NLP: 'true'
      LIMIT_ARG: ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      VARIANTS_ARG: ${{ inputs.variants && format('--variants {0}', inputs.variants) || '' }}
      PLACEBO_ARG: ${{ inputs.placebo && format('--placebo {0}', inputs.placebo) || '' }}
      TRIAL_PHASE: ${{ inputs.trial_phase || 'adhoc' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r jobs/requirements.txt

      # StepM needs arch; without it the summary says StepM was not run (never a silent pass)
      - name: Install research dependencies
        continue-on-error: true
        run: pip install -r requirements-research.txt

      # Price history (5 years per ticker) is reused across runs; only missing tickers download
      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/backtest_history/*.parquet
          key: ${{ runner.os }}-backtest-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-backtest-history-

      # SEC filings (earnings calendar, deal filings): older submission pages never change; the
      # recent block is refetched after 72 hours by the harness itself
      - name: Restore SEC filings
        uses: actions/cache/restore@v4
        with:
          path: data/backtest_history/sec/submissions
          key: ${{ runner.os }}-sec-submissions-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-sec-submissions-

      - name: Phase 1 - strategy scans
        run: python scripts/validate_backtest_pipeline.py --universe production --workers 4 --phase1-only $LIMIT_ARG

      - name: Save price history
        if: always() && inputs.limit == ''
        uses: actions/cache/save@v4
        with:
          path: data/backtest_history/*.parquet
          key: ${{ runner.os }}-backtest-history-${{ github.run_id }}

      - name: Save SEC filings
        if: always() && inputs.limit == ''
        uses: actions/cache/save@v4
        with:
          path: data/backtest_history/sec/submissions
          key: ${{ runner.os }}-sec-submissions-${{ github.run_id }}

      - name: Phase 2 - replay and statistics
        run: >
          python scripts/validate_backtest_pipeline.py --universe production --workers 4
          $LIMIT_ARG $VARIANTS_ARG $PLACEBO_ARG --trial-phase "$TRIAL_PHASE"

      - name: Persist trials (config/research_trials.jsonl on main)
        if: always()
        run: python scripts/persist_trials.py outputs/research_trials.jsonl --run-id "${{ github.run_id }}" --push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-production-universe
          path: |
            outputs/production_backtest_summary_production_universe.json
            outputs/production_backtest_trades_production_universe.csv
            outputs/production_backtest_setup_trades_production_universe.csv
            outputs/production_backtest_funnel_by_date_production_universe.csv
            outputs/strategy_performance_production_universe.json
            outputs/production_backtest_summary_production_universe_smoke.json
            outputs/production_backtest_variants.json
            outputs/production_backtest_variant_trades.csv
            outputs/research_trials.jsonl
          if-no-files-found: warn
          retention-days: 90
