name: Price cache tools

# Runs scripts/time_price_refresh.py on a copy of the nightly's restored price cache. No Supabase
# access. Modes:
#   time     time the nightly refresh with corporate-action refetch (the cache is not saved back)
#   rebuild  full adjusted history into a fresh directory; only if it passes the coverage,
#            history-length and last-bar checks is it saved as the newest nightly cache
# Run outside the nightly window (01:00-10:00 UTC), so no nightly saves an older cache after it.

on:
  schedule:
    # Monthly validated rebuild with a drift report: the first Sunday of the month, 12:00 UTC (cron
    # ORs day-of-month with day-of-week, so it fires every Sunday and the job skips the rest)
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'time or rebuild'
        required: true
        default: 'time'
      actions_since:
        description: 'time: count dividends and splits from this date as new (YYYY-MM-DD; empty = last cached session)'
        required: false
        default: ''
      screen:
        description: 'Also report the live Cross-Sectional screen on this session (YYYY-MM-DD; empty = skip)'
        required: false
        default: ''
      tickers:
        description: 'With screen: comma-separated tickers to report ranks for'
        required: false
        default: ''
      sec_events:
        description: 'Comma-separated tickers: print their SEC 8-K item 2.02 events from the restored cache'
        required: false
        default: ''
      sec_audit:
        description: 'true: acceptance-time check of every cached SEC document, per fetch hour'
        required: false
        default: 'false'
      sec_cache_key:
        description: 'With sec_audit: also restore and audit this backtest SEC cache (e.g. Linux-sec-submissions-<run id>)'
        required: false
        default: ''
      cache_key:
        description: 'time/screen only: restore this exact nightly cache (e.g. Linux-data-cache-v2-<run id>); empty = the newest'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: nightly-scan          # never alongside a nightly that restores or saves the same cache
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      SKIP_NLP: 'true'
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      MODE: ${{ github.event_name == 'schedule' && 'rebuild' || inputs.mode }}
    steps:
      - name: Monthly only
        id: when
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-d)" -gt 7 ]; then
            echo "Not the first Sunday of the month: no rebuild."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.when.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.when.outputs.skip != 'true'
        with:
          python-version: '3.11.17'
          cache: 'pip'
      - uses: actions/cache/restore@v4
        if: steps.when.outputs.skip != 'true'
        with:
          path: data/cache
          key: ${{ (env.MODE != 'rebuild' && inputs.cache_key) || format('{0}-data-cache-v2-none', runner.os) }}
          restore-keys: |
            ${{ (env.MODE != 'rebuild' && inputs.cache_key) || format('{0}-data-cache-v2-', runner.os) }}
      - uses: actions/cache/restore@v4
        if: steps.when.outputs.skip != 'true' && inputs.sec_cache_key != ''
        with:
          path: data/backtest_history/sec/submissions
          key: ${{ inputs.sec_cache_key }}
          fail-on-cache-miss: true
      - if: steps.when.outputs.skip != 'true'
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.lock
      - name: Run
        if: steps.when.outputs.skip != 'true'
        run: >
          python scripts/time_price_refresh.py
          ${{ env.MODE == 'rebuild' && '--rebuild' || '' }}
          ${{ inputs.actions_since && format('--actions-since {0}', inputs.actions_since) || '' }}
          ${{ inputs.screen && format('--screen {0} --tickers "{1}"', inputs.screen, inputs.tickers) || '' }}
          ${{ inputs.sec_events && format('--sec-events "{0}"', inputs.sec_events) || '' }}
          ${{ inputs.sec_audit == 'true' && '--sec-audit' || '' }}
      - name: Save the rebuilt cache (only when the checks passed)
        if: success() && env.MODE == 'rebuild' && steps.when.outputs.skip != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-data-cache-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.when.outputs.skip != 'true'
        with:
          name: price-cache-tools
          retention-days: 90
          path: outputs/screen_*.csv
          if-no-files-found: ignore
