name: Swing Research Pipeline

# Pre-registered swing signals holdout study (CLAUDE.md, "Swing signals program"): full universe,
# U1 and U2, 200 placebos, holdout 2008-01-02..2022-09-30. One job per sleeve. The decide job
# writes outputs/swing/decisions.json and config/swing_sleeves.json with this run's id; they are
# committed only from a successful run of this workflow.

on:
  workflow_dispatch:
    inputs:
      placebo:
        description: 'Random-stock placebo runs per sleeve and universe'
        required: false
        default: '200'
      limit:
        description: 'Smoke test: first N tickers (empty = full universe; results are marked smoke and never adopted)'
        required: false
        default: ''

concurrency:
  group: swing-research
  cancel-in-progress: false

env:
  PYTHONPATH: .
  SKIP_NLP: 'true'
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  LIMIT_ARG: ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}

jobs:
  data:
    name: Build data (prices 2004+, SEC 2006+, insider data sets)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r jobs/requirements.txt -r requirements-research.txt
      - name: Restore research data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/universe
          key: swing-research-data-v2-${{ github.run_id }}
          restore-keys: swing-research-data-v2-
      - name: Build data
        run: python scripts/build_swing_data.py $LIMIT_ARG
      - name: Save research data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/universe
          key: swing-research-data-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-data-summary
          path: outputs/swing/
          if-no-files-found: warn

  replication:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt -r jobs/requirements.txt -r requirements-research.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/universe
          key: swing-research-data-v2-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: python scripts/research_swing.py --stage replication $LIMIT_ARG
      - run: python scripts/research_swing.py --stage patterns $LIMIT_ARG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-replication
          path: |
            outputs/swing/replication.json
            outputs/swing/patterns.json
            outputs/research_trials.jsonl

  sleeve:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        sleeve: [T, E, N, P, I]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt -r jobs/requirements.txt -r requirements-research.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/backtest_history_long
            data/cache/universe
          key: swing-research-data-v2-${{ github.run_id }}
          fail-on-cache-miss: true
      - run: python scripts/research_swing.py --stage sleeve --sleeve ${{ matrix.sleeve }} --placebo ${{ inputs.placebo || '200' }} $LIMIT_ARG
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swing-sleeve-${{ matrix.sleeve }}
          path: |
            outputs/swing/sleeve_${{ matrix.sleeve }}.json
            outputs/swing/trades_${{ matrix.sleeve }}_*.csv
            outputs/research_trials.jsonl

  decide:
    needs: [replication, sleeve]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt -r jobs/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect sleeve and replication outputs
        run: |
          mkdir -p outputs/swing
          # artifacts keep their paths relative to outputs/ (e.g. swing/sleeve_T.json)
          find artifacts -name 'replication.json' -exec cp {} outputs/swing/ \;
          find artifacts -name 'patterns.json' -exec cp {} outputs/swing/ \;
          find artifacts -name 'sleeve_*.json' -exec cp {} outputs/swing/ \;
          find artifacts -name 'data_summary.json' -exec cp {} outputs/swing/ \;
          ls -la outputs/swing
      - run: python scripts/research_swing.py --stage decide $LIMIT_ARG
      - uses: actions/upload-artifact@v4
        with:
          name: swing-decisions
          path: |
            outputs/swing/decisions.json
            outputs/swing/replication.json
            outputs/swing/patterns.json
            config/swing_sleeves.json
